name: Aggiorna incentivi

on:
  schedule:
    - cron: '17 4 * * *'   # ogni giorno alle 6:17 ora italiana (legale)
    - cron: '17 15 * * *'  # secondo tentativo alle 17:17
  workflow_dispatch:        # permette di avviarlo a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Scarica gli incentivi
        run: node scripts/scarica.mjs

      - name: Salva il file nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incentivi.json
          git diff --staged --quiet || git commit -m "Aggiornamento incentivi $(date -u +%F)"
          git push
